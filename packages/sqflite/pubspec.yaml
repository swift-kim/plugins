name: sqflite_tizen

flutter:
  plugin:
    platforms:
      tizen:
        dartPluginClass: SqflitePlugin
        fileName: sqflite_tizen.dart

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.0.7
  path_provider_tizen: ^2.0.1
  sqflite:
    path: ../../../sqflite/sqflite
  sqflite_common:
  sqflite_common_ffi:
    path: ../../../sqflite/sqflite_common_ffi
  sqlite3: ^1.3.1

environment:
  sdk: '>=2.13.0 <3.0.0'
  flutter: '>=2.2.0'
