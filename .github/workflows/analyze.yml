name: Analyze

on: [push, pull_request]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: subosito/flutter-action@v1
        with:
          channel: stable
      - name: Run analyze
        run: ./tools/tools_runner.sh analyze --custom-analysis=audioplayers,battery_plus,connectivity_plus,device_info_plus,flutter_tts,geolocator,network_info_plus,package_info_plus,permission_handler,sensors_plus,share_plus,sqflite,wakelock
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: subosito/flutter-action@v1
        with:
          channel: stable
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install clang-format-11
      - name: Run format
        run: ./tools/tools_runner.sh format --fail-on-change --clang-format=clang-format-11
